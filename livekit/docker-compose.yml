# Production: LiveKit server + Egress (recording) + Redis on one Ubuntu VM.
# See README.md. Run: docker compose up -d
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6379

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on: [redis]

  egress:
    image: livekit/egress:v1.15.0
    restart: unless-stopped
    network_mode: host
    cap_add: [SYS_ADMIN]
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - ./recordings:/out
    depends_on: [redis, livekit]
  # Speech-to-text for class transcripts (whisper.cpp). Models in ../whisper/models.
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp@sha256:293b9d86c3d191764a95183bb1eeb6a0e165b9e69aad96c02ac232f1f4fdf523
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/app/build/bin/whisper-server"]
    command: ["--host", "127.0.0.1", "--port", "8178", "-m", "/models/ggml-small.bin", "-l", "auto", "-t", "4",
              "--convert", "--vad", "-vm", "/models/ggml-silero-v5.1.2.bin"]
    volumes:
      - ../whisper/models:/models:ro
