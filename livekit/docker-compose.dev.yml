# Local video server WITH recording: LiveKit + Egress + Redis in Docker.
#   docker compose -f docker-compose.dev.yml up -d
# Use this instead of bin/livekit-server.exe when you want classes recorded
# (both use port 7880, so run only one of them). Recordings land in ./recordings
# and the backend picks them up (LIVEKIT_EGRESS_ENABLED=true in backend/.env).
# Egress runs a headless Chrome – Docker needs ~2 GB of free RAM.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.dev.docker.yaml:/etc/livekit.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [redis]
  egress:
    image: livekit/egress:v1.15.0
    restart: unless-stopped
    network_mode: "service:livekit"
    cap_add: [SYS_ADMIN]
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.dev.yaml:/etc/egress.yaml:ro
      - ./recordings:/out
    depends_on: [livekit]
  # Speech-to-text for class transcripts (whisper.cpp, open source). Needs the
  # models in ../whisper/models – see ../whisper/README.md.
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp@sha256:293b9d86c3d191764a95183bb1eeb6a0e165b9e69aad96c02ac232f1f4fdf523
    restart: unless-stopped
    entrypoint: ["/app/build/bin/whisper-server"]
    command: ["--host", "0.0.0.0", "--port", "8080", "-m", "/models/ggml-small.bin", "-l", "auto", "-t", "10",
              "--convert", "--vad", "-vm", "/models/ggml-silero-v5.1.2.bin"]
    ports:
      - "127.0.0.1:8178:8080"
    volumes:
      - ../whisper/models:/models:ro
