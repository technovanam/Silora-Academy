# LiveKit server config for local development (used by start-livekit.sh)
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
keys:
  devkey: secret
logging:
  level: info
room:
  empty_timeout: 300
  max_participants: 12
# Recording finished -> backend picks up the file
webhook:
  api_key: devkey
  urls:
    - http://localhost:5000/api/portal/livekit/webhook
