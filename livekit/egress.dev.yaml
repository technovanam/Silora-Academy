# Egress (recorder) for LOCAL development – shares the livekit container's
# network (see docker-compose.dev.yml), so LiveKit is on 127.0.0.1.
# Dev keys only (devkey / secret) – production uses egress.yaml.
api_key: devkey
api_secret: secret
ws_url: ws://127.0.0.1:7880
redis:
  address: redis:6379
log_level: info
# LiveKit is on 127.0.0.1 in the shared network namespace. Chrome normally hides its
# local address behind an mDNS name (which LiveKit can't resolve) and skips loopback,
# so the recorder's media connection would never form.
chrome_flags:
  allow-loopback-in-peer-connection: true
  disable-features: "WebRtcHideLocalIpsWithMdns,site-per-process,Translate,BlinkGenPropertyTrees"
# Audio-only captures for transcripts are light; let a full class (12 mics) fit beside the video
cpu_cost:
  track_cpu_cost: 0.5
