# LiveKit for LOCAL development with recording (runs in Docker, see docker-compose.dev.yml).
# Browsers on this PC connect to ws://localhost:7880; media uses 127.0.0.1:50000-50100/udp.
# The Egress recorder shares this container's network, so it reaches LiveKit on 127.0.0.1
# no matter what your Wi-Fi address is. Dev keys only (devkey / secret).
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  node_ip: 127.0.0.1
redis:
  address: redis:6379
keys:
  devkey: secret
logging:
  level: info
room:
  empty_timeout: 300
  max_participants: 12
# Recording finished / participant joined -> backend on the host
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:5000/api/portal/livekit/webhook
